<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCE Connect — Academic Year Setup API</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f9;
        }

        /* ── Top banner ── */
        #top-banner {
            background: linear-gradient(135deg, #1a3c5e 0%, #1d6fa4 100%);
            color: #fff;
            padding: 22px 40px 18px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
        }
        #top-banner .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }
        #top-banner .logo span { color: #63c9f5; }
        #top-banner .meta { flex: 1; }
        #top-banner .meta h1 {
            font-size: 17px;
            font-weight: 600;
            line-height: 1.3;
        }
        #top-banner .meta p {
            font-size: 12px;
            opacity: 0.75;
            margin-top: 3px;
        }
        #top-banner .badge {
            background: rgba(255,255,255,.15);
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 600;
        }

        /* ── Flow progress strip ── */
        #flow-strip {
            background: #fff;
            border-bottom: 1px solid #dde3ea;
            padding: 14px 40px;
            overflow-x: auto;
            white-space: nowrap;
        }
        #flow-strip .strip-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: #6b7a8d;
            margin-bottom: 10px;
        }
        .flow-steps {
            display: inline-flex;
            align-items: center;
            gap: 0;
        }
        .flow-step {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            position: relative;
        }
        .flow-step .num {
            width: 20px; height: 20px;
            border-radius: 50%;
            background: rgba(255,255,255,.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700;
            flex-shrink: 0;
        }
        .flow-step.phase-ay   { background: #1d6fa4; }
        .flow-step.phase-ic   { background: #27a36c; }
        .flow-step.phase-ac   { background: #e07b2a; }
        .flow-step.phase-is   { background: #7b5ea7; }
        .flow-step.phase-state { background: #555e6b; font-style: italic; }
        .flow-step.phase-stu   { background: #d4436e; }
        .flow-step.phase-staff { background: #0e9aa7; }

        .flow-arrow {
            width: 22px; height: 2px;
            background: #c0cad6;
            position: relative;
            flex-shrink: 0;
        }
        .flow-arrow::after {
            content: '';
            position: absolute;
            right: -1px; top: -4px;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 7px solid #c0cad6;
        }

        /* ── Swagger wrapper ── */
        #swagger-ui-wrapper {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* Swagger UI overrides */
        .swagger-ui .topbar { display: none !important; }
        .swagger-ui .info { margin: 0 0 20px !important; }
        .swagger-ui .info .title { font-size: 22px !important; }
        .swagger-ui .scheme-container { padding: 12px 0 !important; }
        .swagger-ui .opblock-tag {
            font-size: 15px !important;
            border-bottom: 2px solid #e0e7ef !important;
        }
        .swagger-ui .opblock .opblock-summary-method {
            font-size: 13px !important;
            min-width: 72px !important;
        }
        /* Tag colour accents */
        .swagger-ui .opblock-tag[data-tag="Academic Year"] { border-color: #1d6fa4 !important; color: #1d6fa4 !important; }
        .swagger-ui .opblock-tag[data-tag="Calendar"]       { border-color: #27a36c !important; color: #27a36c !important; }
        .swagger-ui .opblock-tag[data-tag="Institutional Structure"] { border-color: #7b5ea7 !important; color: #7b5ea7 !important; }
        .swagger-ui .opblock-tag[data-tag="AY State"]       { border-color: #555e6b !important; color: #555e6b !important; }
        .swagger-ui .opblock-tag[data-tag="Students"]        { border-color: #d4436e !important; color: #d4436e !important; }
        .swagger-ui .opblock-tag[data-tag="Staff"]           { border-color: #0e9aa7 !important; color: #0e9aa7 !important; }
    </style>
</head>
<body>

<!-- ═══════════════════ TOP BANNER ═══════════════════ -->
<div id="top-banner">
    <div class="logo">TCE <span>Connect</span></div>
    <div class="meta">
        <h1>Academic Year Setup API</h1>
        <p>CX Connect Platform &nbsp;·&nbsp; Development Server &nbsp;·&nbsp; OpenAPI 3.0.3</p>
    </div>
    <div class="badge">v1.0.0</div>
</div>

<!-- ═══════════════════ FLOW STRIP ═══════════════════ -->
<div id="flow-strip">
    <div class="strip-label"> AY Setup Flow — 8 API calls</div>
    <div class="flow-steps">

        <div class="flow-step phase-ay">
            <span class="num">1</span>Create Academic Year
        </div>
        <div class="flow-arrow"></div>

        <!-- <div class="flow-step phase-state">
          <span class="num">2</span>Init State
        </div>
        <div class="flow-arrow"></div> -->

        <!-- <div class="flow-step phase-ic">
          <span class="num">3</span>Week-Off Events
        </div>
        <div class="flow-arrow"></div>

        <div class="flow-step phase-state">
          <span class="num">4</span>Update State
        </div>
        <div class="flow-arrow"></div> -->

        <!-- <div class="flow-step phase-ac">
          <span class="num">5</span>Terms &amp; Vacations
        </div>
        <div class="flow-arrow"></div>

        <div class="flow-step phase-state">
          <span class="num">6</span>Update State
        </div>
        <div class="flow-arrow"></div> -->

        <div class="flow-step phase-is">
            <span class="num">2</span>Create Sections
        </div>
        <div class="flow-arrow"></div>

        <div class="flow-step phase-is">
            <span class="num">3</span>Fetch Grades
        </div>
        <div class="flow-arrow"></div>

        <div class="flow-step phase-is">
            <span class="num">4</span>Link Grades
        </div>
        <div class="flow-arrow"></div>

        <div class="flow-step phase-is">
            <span class="num">5</span>Create Classes
        </div>
        <div class="flow-arrow"></div>

        <!-- <div class="flow-step phase-state">
          <span class="num">11</span>Update State
        </div>
        <div class="flow-arrow"></div> -->

        <div class="flow-step phase-stu">
            <span class="num">6</span>Create Students
        </div>
        <div class="flow-arrow"></div>

        <div class="flow-step phase-stu">
            <span class="num">7</span>Assign to Class
        </div>
        <div class="flow-arrow"></div>

        <div class="flow-step phase-staff">
            <span class="num">8</span>Create Teacher
        </div>

    </div>
</div>

<!-- ═══════════════════ SWAGGER UI ═══════════════════ -->
<div id="swagger-ui-wrapper">
    <div id="swagger-ui"></div>
</div>

<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
<script>
    const spec = {
        "openapi": "3.0.3",
        "info": {
            "title": "TCE — Academic Year Setup API",
            "description": "APIs for setting up an Academic Year on the TCE platform. Covers AY creation, institutional structure (sections, grades, class divisions)",
            "version": "1.0.0",
            "contact": { "email": "niteshg@tataclassedge.com" }
        },
        // "servers": [
        //   {
        //     "url": "https://cx-dev-connect.devstudi.com",
        //     "description": "CX Development Server"
        //   }
        // ],
        "tags": [
            { "name": "Academic Year",           "description": "Create and manage academic years" },
            { "name": "Institutional Structure", "description": "Sections, grades, and class division management" },
            { "name": "Students",               "description": "Student creation and management" },
            { "name": "Staff",                  "description": "Teacher and staff creation and management" }
        ],
        "paths": {

            "/connect/4/1/api/v1/institutions/academicyears": {
                "post": {
                    "tags": ["Academic Year"],
                    "summary": "Create Academic Year",
                    "description": "Creates a new academic year with a label, start date, end date, and active flag. The returned `id` (aye-...) is required as a reference for all subsequent setup APIs.",
                    "operationId": "createAcademicYear",
                    "requestBody": {
                        "required": true,
                        "content": {
                            "application/json": {
                                "schema": { "$ref": "#/components/schemas/AcademicYearRequest" },
                                "example": {
                                    "label": "Academic Year Sep 26 - Aug 27",
                                    "startDate": 1788546600000,
                                    "endDate": 1819650600000,
                                    "isActive": true
                                }
                            }
                        }
                    },
                    "responses": {
                        "200": {
                            "description": "Academic year created successfully",
                            "content": {
                                "application/json": {
                                    "schema": { "$ref": "#/components/schemas/AcademicYearResponse" },
                                    "example": {
                                        "id": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35",
                                        "label": "Academic Year Sep 26 - Aug 27",
                                        "startDate": "2026-09-05T00:00:00.000+05:30",
                                        "endDate": "2027-08-31T00:00:00.000+05:30",
                                        "status": 1,
                                        "createdDate": "2026-05-11T16:30:28.542440506",
                                        "lastModifiedDate": "2026-05-11T16:30:28.542440506",
                                        "curriculumId": null
                                    }
                                }
                            }
                        },
                        "400": {
                            "description": "Bad Request — Either the start date is in the past, or a draft Academic Year already exists.",
                            "content": {
                                "application/json": {
                                    "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                                    "examples": {
                                        "PastStartDate": {
                                            "summary": "Start date is in the past",
                                            "value": {
                                                "errorCode": 4,
                                                "errorMessage": "We can only create draft AY with future start dates."
                                            }
                                        },
                                        "DraftAlreadyExists": {
                                            "summary": "Draft AY already exists",
                                            "value": {
                                                "errorCode": 4,
                                                "errorMessage": "Draft AY already exists."
                                            }
                                        }
                                    }
                                }
                            }
                        },
                        "500": { "$ref": "#/components/responses/InternalServerError" }
                    }
                }
            },

            "/connect/4/1/api/v1/institutions/sections": {
                "post": {
                    "tags": ["Institutional Structure"],
                    "summary": "Create Sections",
                    "description": "Creates one or more sections (e.g., Primary, Secondary) under an academic year. Sections are the top-level grouping for grades.",
                    "operationId": "createSections",
                    "requestBody": {
                        "required": true,
                        "content": {
                            "application/json": {
                                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/SectionRequest" } },
                                "example": [
                                    {
                                        "label": "Secondary",
                                        "academicYearId": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35",
                                        "order": 400,
                                        "tags": { "uniqId": "sec-4" }
                                    }
                                ]
                            }
                        }
                    },
                    "responses": {
                        "200": {
                            "description": "Sections created successfully",
                            "content": {
                                "application/json": {
                                    "schema": { "type": "array", "items": { "$ref": "#/components/schemas/SectionResponse" } },
                                    "example": [
                                        {
                                            "id": "sec-13ee51ae-6c36-4bb1-9a91-aad278298bb1",
                                            "label": "Secondary",
                                            "academicYearId": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35",
                                            "tags": { "uniqId": "sec-4" },
                                            "order": 400,
                                            "createdDate": "2026-05-11T16:53:10.900240843",
                                            "lastModifiedDate": "2026-05-11T16:53:10.900240843"
                                        }
                                    ]
                                }
                            }
                        },
                        "500": { "$ref": "#/components/responses/InternalServerError" }
                    }
                }
            },

            "/connect/5/1/api/v1/institutions/grades/master": {
                "get": {
                    "tags": ["Institutional Structure"],
                    "summary": "Get Master Grade List",
                    "description": "Retrieves the static master list of all available grades (Nursery through Class 12). Used as reference data when linking grades to sections.",
                    "operationId": "getMasterGrades",
                    "responses": {
                        "200": {
                            "description": "Full master grade list",
                            "content": {
                                "application/json": {
                                    "schema": { "type": "array", "items": { "$ref": "#/components/schemas/Grade" } },
                                    "example": [
                                        { "id": "grd-26fac606-ea6e-4435-9799-19387ab376ee", "title": "Nursery",   "status": "ACTIVE", "order": 300  },
                                        { "id": "grd-63c39a89-72ec-4661-aa97-acd8d3a5f94d", "title": "Junior KG", "status": "ACTIVE", "order": 400  },
                                        { "id": "grd-31e07054-ae04-40b7-a4df-5bf164e20d07", "title": "Senior KG", "status": "ACTIVE", "order": 500  },
                                        { "id": "grd-224852e2-98fa-4fbd-867f-d76693aeaa66", "title": "Class 1",   "status": "ACTIVE", "order": 600  },
                                        { "id": "grd-3eade967-ba2c-493a-91d8-c52971c63d72", "title": "Class 2",   "status": "ACTIVE", "order": 700  },
                                        { "id": "grd-ff291bba-0ca8-4a94-941a-9d318b09486d", "title": "Class 3",   "status": "ACTIVE", "order": 800  },
                                        { "id": "grd-1f4c7dde-7e86-4d96-9915-767b5b52da51", "title": "Class 4",   "status": "ACTIVE", "order": 900  },
                                        { "id": "grd-c7350c6c-2bd2-4174-863f-eb27f59c309c", "title": "Class 5",   "status": "ACTIVE", "order": 1000 },
                                        { "id": "grd-4d8a50f1-7793-485e-9360-b6f0d86d9876", "title": "Class 6",   "status": "ACTIVE", "order": 1100 },
                                        { "id": "grd-b7310559-ff1b-42fa-92fd-d77ee0b72fd1", "title": "Class 7",   "status": "ACTIVE", "order": 1200 },
                                        { "id": "grd-bb851b0a-2b42-4ed7-b6b0-5fd165dcefd3", "title": "Class 8",   "status": "ACTIVE", "order": 1300 },
                                        { "id": "grd-452ca1b2-8277-4284-8283-babc2f328f76", "title": "Class 9",   "status": "ACTIVE", "order": 1400 },
                                        { "id": "grd-0519580e-0c8a-4135-9ffe-ebd5d576fd11", "title": "Class 10",  "status": "ACTIVE", "order": 1500 },
                                        { "id": "grd-74cc96e3-3ba0-44af-b60e-722e44cdefdc", "title": "Class 11",  "status": "ACTIVE", "order": 1600 },
                                        { "id": "grd-af6b5a1c-2957-4446-a706-424013b1f334", "title": "Class 12",  "status": "ACTIVE", "order": 1700 }
                                    ]
                                }
                            }
                        },
                        "500": { "$ref": "#/components/responses/InternalServerError" }
                    }
                }
            },

            "/connect/4/1/api/v1/institutions/sections/grades": {
                "put": {
                    "tags": ["Institutional Structure"],
                    "summary": "Link Grades to Section",
                    "description": "Links one or more grades to a section within an academic year. Grade IDs are obtained from the master grades endpoint (Step 8).",
                    "operationId": "linkGradesToSection",
                    "requestBody": {
                        "required": true,
                        "content": {
                            "application/json": {
                                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/SectionGradeRequest" } },
                                "example": [
                                    {
                                        "academicYearId": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35",
                                        "sectionId": "sec-13ee51ae-6c36-4bb1-9a91-aad278298bb1",
                                        "gradeId": "grd-452ca1b2-8277-4284-8283-babc2f328f76"
                                    }
                                ]
                            }
                        }
                    },
                    "responses": {
                        "200": {
                            "description": "Grades linked to section successfully",
                            "content": {
                                "application/json": {
                                    "schema": { "type": "array", "items": { "$ref": "#/components/schemas/SectionGradeResponse" } },
                                    "example": [
                                        {
                                            "sectionId": "sec-13ee51ae-6c36-4bb1-9a91-aad278298bb1",
                                            "gradeId": "grd-452ca1b2-8277-4284-8283-babc2f328f76"
                                        }
                                    ]
                                }
                            }
                        },
                        "500": { "$ref": "#/components/responses/InternalServerError" }
                    }
                }
            },

            "/connect/5/31/api/v1/institutions/students": {
                "post": {
                    "tags": ["Students"],
                    "summary": "Create Students",
                    "description": "Creates one or more students under an institution. If the mobile number is not provided it will be auto-generated based on the school settings.",
                    "operationId": "createStudents",
                    "requestBody": {
                        "required": true,
                        "content": {
                            "application/json": {
                                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/StudentRequest" } },
                                "example": [
                                    {
                                        "firstName": "ERPMAY",
                                        "lastName": "SIX",
                                        "grNumber": "KCPS-2019-001-036",
                                        "gender": "MALE",
                                        "dateOfBirth": "01/01/2014",
                                        "mobile": "9999988888"
                                    }
                                ]
                            }
                        }
                    },
                    "responses": {
                        "200": {
                            "description": "Students created successfully",
                            "content": {
                                "application/json": {
                                    "schema": { "type": "array", "items": { "$ref": "#/components/schemas/StudentResponse" } },
                                    "example": [
                                        {
                                            "seatcode": "KCP275536"
                                        }
                                    ]
                                }
                            }
                        },
                        "500": { "$ref": "#/components/responses/InternalServerError" }
                    }
                }
            },

            "/connect/5/31/api/v1/institutions/staff": {
                "post": {
                    "tags": ["Staff"],
                    "summary": "Create Teacher",
                    "description": "Creates one or more teachers under an institution. If the phone number is not provided it will be auto-generated based on the school settings. The returned seatcode is used as the teacher identifier in subsequent API calls.",
                    "operationId": "createStaff",
                    "requestBody": {
                        "required": true,
                        "content": {
                            "application/json": {
                                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/StaffRequest" } },
                                "example": [
                                    {
                                        "title": "Mr",
                                        "firstName": "Kartik",
                                        "lastName": "Shah",
                                        "gender": "MALE",
                                        "phone": "9999988888"
                                    }
                                ]
                            }
                        }
                    },
                    "responses": {
                        "200": {
                            "description": "Teachers created successfully. Returns list of seatcodes assigned to the created teachers.",
                            "content": {
                                "application/json": {
                                    "schema": {
                                        "type": "array",
                                        "items": { "type": "string" },
                                        "description": "Seatcodes of newly created teachers"
                                    },
                                    "example": ["KCP913369"]
                                }
                            }
                        },
                        "500": { "$ref": "#/components/responses/InternalServerError" }
                    }
                }
            },

            "/connect/5/31/api/v1/institutions/classes/{classId}/students": {
                "post": {
                    "tags": ["Students"],
                    "summary": "Assign Students to a Class",
                    "description": "Assigns one or more students to a class using their seatcodes. The `classId` path parameter identifies the target class division.",
                    "operationId": "assignStudentsToClass",
                    "parameters": [
                        {
                            "name": "classId",
                            "in": "path",
                            "required": true,
                            "description": "ID of the target class division (cls-... UUID from Create Class Divisions response)",
                            "schema": { "type": "string", "example": "cls-8894eddb-e8eb-4589-90f9-939a2b339251" }
                        }
                    ],
                    "requestBody": {
                        "required": true,
                        "content": {
                            "application/json": {
                                "schema": {
                                    "type": "array",
                                    "items": { "type": "string" },
                                    "description": "List of student seatcodes to assign to the class"
                                },
                                "example": ["KCP913366"]
                            }
                        }
                    },
                    "responses": {
                        "200": {
                            "description": "Students assigned to class successfully. Returns the list of seatcodes that were processed.",
                            "content": {
                                "application/json": {
                                    "schema": {
                                        "type": "array",
                                        "items": { "type": "string" },
                                        "description": "Seatcodes of students successfully assigned"
                                    },
                                    "example": ["KCP913366"]
                                }
                            }
                        },
                        "500": { "$ref": "#/components/responses/InternalServerError" }
                    }
                }
            },

            "/connect/4/1/api/v1/institutions/classes": {
                "post": {
                    "tags": ["Institutional Structure"],
                    "summary": "Create Class Divisions",
                    "description": "Creates one or more class divisions (e.g., Division A, Division B) under a grade within an academic year.",
                    "operationId": "createClasses",
                    "requestBody": {
                        "required": true,
                        "content": {
                            "application/json": {
                                "schema": { "type": "array", "items": { "$ref": "#/components/schemas/ClassRequest" } },
                                "example": [
                                    {
                                        "gradeId": "grd-452ca1b2-8277-4284-8283-babc2f328f76",
                                        "academicYearId": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35",
                                        "order": 1,
                                        "label": "Division A"
                                    }
                                ]
                            }
                        }
                    },
                    "responses": {
                        "200": {
                            "description": "Class divisions created successfully",
                            "content": {
                                "application/json": {
                                    "schema": { "type": "array", "items": { "$ref": "#/components/schemas/ClassResponse" } },
                                    "example": [
                                        {
                                            "id": "cls-8894eddb-e8eb-4589-90f9-939a2b339251",
                                            "partition": 0,
                                            "label": "Division A",
                                            "academicYearId": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35",
                                            "gradeId": "grd-452ca1b2-8277-4284-8283-babc2f328f76",
                                            "tags": null,
                                            "classTeacherId": null,
                                            "order": 1,
                                            "createdDate": "2026-05-11T16:53:24.560281391",
                                            "lastModifiedDate": "2026-05-11T16:53:24.560281391",
                                            "telegramChatId": null
                                        }
                                    ]
                                }
                            }
                        },
                        "500": { "$ref": "#/components/responses/InternalServerError" }
                    }
                }
            }

        },

        "components": {
            "responses": {
                "InternalServerError": {
                    "description": "Internal Server Error — Please contact the TCE team for assistance.",
                    "content": {
                        "application/json": {
                            "schema": { "$ref": "#/components/schemas/ErrorResponse" },
                            "example": {
                                "errorCode": 500,
                                "errorMessage": "WEB-MjAyNi0wNi0wOSAxNjoyMzoxNjo4OTg="
                            }
                        }
                    }
                }
            },
            "schemas": {

                "ErrorResponse": {
                    "type": "object",
                    "properties": {
                        "errorCode":    { "type": "integer", "description": "Numeric error code identifying the type of failure.", "example": 4 },
                        "errorMessage": { "type": "string",  "description": "Human-readable description of the error.",          "example": "We can only create draft AY with future start dates." }
                    }
                },

                "AcademicYearRequest": {
                    "type": "object",
                    "required": ["label", "startDate", "endDate", "isActive"],
                    "properties": {
                        "label":     { "type": "string",  "description": "Human-readable label",                           "example": "Academic Year Sep 26 - Aug 27" },
                        "startDate": { "type": "integer", "format": "int64", "description": "Start date in epoch ms (IST)", "example": 1788546600000 },
                        "endDate":   { "type": "integer", "format": "int64", "description": "End date in epoch ms (IST)",   "example": 1819650600000 },
                        "isActive":  { "type": "boolean", "description": "Whether this academic year is active",            "example": true }
                    }
                },

                "AcademicYearResponse": {
                    "type": "object",
                    "properties": {
                        "id":                   { "type": "string",  "description": "System UUID prefixed with 'aye-'", "example": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35" },
                        "label":                { "type": "string",  "example": "Academic Year Sep 26 - Aug 27" },
                        "startDate":            { "type": "string",  "format": "date-time" },
                        "endDate":              { "type": "string",  "format": "date-time" },
                        "status":               { "type": "integer", "example": 1 },
                        "createdDate":          { "type": "string",  "format": "date-time" },
                        "lastModifiedDate":     { "type": "string",  "format": "date-time" },
                        "curriculumId":         { "type": "string",  "nullable": true, "example": null }
                    }
                },

                "SetupModuleState": {
                    "type": "object",
                    "required": ["status", "enable"],
                    "properties": {
                        "status": {
                            "type": "string",
                            "enum": ["NOT_STARTED", "IN_PROGRESS", "COMPLETED"],
                            "description": "Completion status of this setup module",
                            "example": "IN_PROGRESS"
                        },
                        "enable": {
                            "type": "boolean",
                            "description": "Whether this module is unlocked for the user",
                            "example": true
                        }
                    }
                },

                "AYStateRequest": {
                    "type": "object",
                    "description": "Full state map. All 8 module keys must be present in every call.",
                    "properties": {
                        "instituteCalender":      { "$ref": "#/components/schemas/SetupModuleState" },
                        "academicCalender":       { "$ref": "#/components/schemas/SetupModuleState" },
                        "institutionalStructure": { "$ref": "#/components/schemas/SetupModuleState" },
                        "staffAllocation":        { "$ref": "#/components/schemas/SetupModuleState" },
                        "studentsAllocation":     { "$ref": "#/components/schemas/SetupModuleState" },
                        "allClasses":             { "$ref": "#/components/schemas/SetupModuleState" },
                        "promotion":              { "$ref": "#/components/schemas/SetupModuleState" },
                        "licenseManagement":      { "$ref": "#/components/schemas/SetupModuleState" }
                    }
                },

                "CalendarEventRequest": {
                    "type": "object",
                    "required": ["title", "startDate", "endDate", "allDay", "eventType", "repeat", "calendarType"],
                    "properties": {
                        "academicYearId": { "type": "string",  "description": "Empty string for INSTITUTIONAL events; aye-... ID for ACADEMIC events" },
                        "title":          { "type": "string",  "example": "Term 1" },
                        "description":    { "type": "string",  "example": "" },
                        "startDate":      { "type": "integer", "format": "int64", "description": "Epoch ms", "example": 1788546600000 },
                        "endDate":        { "type": "integer", "format": "int64", "description": "Epoch ms", "example": 1804098600000 },
                        "allDay":         { "type": "boolean", "example": true },
                        "eventType":      { "type": "string",  "enum": ["WEEK_OFF", "ACADEMIC", "VACATIONS"], "example": "ACADEMIC" },
                        "repeat":         { "type": "string",  "enum": ["WEEKLY", "DAILY", "NONE"],            "example": "DAILY" },
                        "metadata":       {
                            "type": "string",
                            "description": "JSON-encoded string. WEEK_OFF keys: color, repeatDays, until. ACADEMIC/VACATIONS keys: labelId, term, sortOrder.",
                            "example": "{\"labelId\":64311425,\"term\":\"Term 1\",\"sortOrder\":1}"
                        },
                        "calendarType":   { "type": "string", "enum": ["INSTITUTIONAL", "ACADEMIC"], "example": "ACADEMIC" }
                    }
                },

                "SectionRequest": {
                    "type": "object",
                    "required": ["label", "academicYearId", "order"],
                    "properties": {
                        "label":          { "type": "string",  "example": "Secondary" },
                        "academicYearId": { "type": "string",  "example": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35" },
                        "order":          { "type": "integer", "description": "Display order", "example": 400 },
                        "tags": {
                            "type": "object",
                            "properties": {
                                "uniqId": { "type": "string", "description": "Tag to correlate with a pre-defined section type", "example": "sec-4" }
                            }
                        }
                    }
                },

                "SectionResponse": {
                    "type": "object",
                    "properties": {
                        "id":                   { "type": "string",  "description": "UUID prefixed with 'sec-'", "example": "sec-13ee51ae-6c36-4bb1-9a91-aad278298bb1" },
                        "label":                { "type": "string",  "example": "Secondary" },
                        "academicYearId":       { "type": "string",  "example": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35" },
                        "tags":                 { "type": "object",  "properties": { "uniqId": { "type": "string" } } },
                        "order":                { "type": "integer", "example": 400 },
                        "createdDate":          { "type": "string",  "format": "date-time" },
                        "lastModifiedDate":     { "type": "string",  "format": "date-time" }
                    }
                },

                "Grade": {
                    "type": "object",
                    "properties": {
                        "id":     { "type": "string",  "description": "UUID prefixed with 'grd-'", "example": "grd-452ca1b2-8277-4284-8283-babc2f328f76" },
                        "title":  { "type": "string",  "example": "Class 9" },
                        "status": { "type": "string",  "enum": ["ACTIVE", "INACTIVE"], "example": "ACTIVE" },
                        "order":  { "type": "integer", "description": "Increments of 100 (300=Nursery … 1700=Class 12)", "example": 1400 }
                    }
                },

                "SectionGradeRequest": {
                    "type": "object",
                    "required": ["academicYearId", "sectionId", "gradeId"],
                    "properties": {
                        "academicYearId": { "type": "string", "example": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35" },
                        "sectionId":      { "type": "string", "description": "ID from Create Sections response", "example": "sec-13ee51ae-6c36-4bb1-9a91-aad278298bb1" },
                        "gradeId":        { "type": "string", "description": "ID from master grades list",       "example": "grd-452ca1b2-8277-4284-8283-babc2f328f76" }
                    }
                },

                "SectionGradeResponse": {
                    "type": "object",
                    "properties": {
                        "sectionId": { "type": "string", "example": "sec-13ee51ae-6c36-4bb1-9a91-aad278298bb1" },
                        "gradeId":   { "type": "string", "example": "grd-452ca1b2-8277-4284-8283-babc2f328f76" }
                    }
                },

                "ClassRequest": {
                    "type": "object",
                    "required": ["gradeId", "academicYearId", "order", "label"],
                    "properties": {
                        "gradeId":        { "type": "string",  "example": "grd-452ca1b2-8277-4284-8283-babc2f328f76" },
                        "academicYearId": { "type": "string",  "example": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35" },
                        "order":          { "type": "integer", "description": "Display order within the grade", "example": 1 },
                        "label":          { "type": "string",  "example": "Division A" }
                    }
                },

                "ClassResponse": {
                    "type": "object",
                    "properties": {
                        "id":                   { "type": "string",  "description": "UUID prefixed with 'cls-'", "example": "cls-8894eddb-e8eb-4589-90f9-939a2b339251" },
                        "partition":            { "type": "integer", "example": 0 },
                        "label":                { "type": "string",  "example": "Division A" },
                        "academicYearId":       { "type": "string",  "example": "aye-30708a62-2c56-48ed-aac6-ee8d1f82ed35" },
                        "gradeId":              { "type": "string",  "example": "grd-452ca1b2-8277-4284-8283-babc2f328f76" },
                        "tags":                 { "type": "object",  "nullable": true },
                        "classTeacherId":       { "type": "string",  "nullable": true },
                        "order":                { "type": "integer", "example": 1 },
                        "createdDate":          { "type": "string",  "format": "date-time" },
                        "lastModifiedDate":     { "type": "string",  "format": "date-time" },
                        "telegramChatId":       { "type": "string",  "nullable": true }
                    }
                },

                "StudentRequest": {
                    "type": "object",
                    "required": ["firstName", "lastName", "grNumber", "gender", "dateOfBirth"],
                    "properties": {
                        "firstName":   { "type": "string",  "example": "ERPMAY" },
                        "lastName":    { "type": "string",  "example": "SIX" },
                        "grNumber":    { "type": "string",  "description": "General Register number — unique student identifier", "example": "KCPS-2019-001-036" },
                        "gender":      { "type": "string",  "enum": ["MALE", "FEMALE", "OTHER"], "example": "MALE" },
                        "dateOfBirth": { "type": "string",  "description": "Date in DD/MM/YYYY format", "example": "01/01/2014" },
                        "mobile":      { "type": "string",  "description": "Mobile number. If omitted, auto-generated per school settings.", "example": "9999988888" }
                    }
                },

                "StudentResponse": {
                    "type": "object",
                    "properties": {
                        "seatcode": { "type": "string", "description": "System-generated unique seat code assigned to the student", "example": "KCP275536" }
                    }
                },

                "StaffRequest": {
                    "type": "object",
                    "required": ["title", "firstName", "lastName", "gender"],
                    "properties": {
                        "title":     { "type": "string", "enum": ["Mr", "Mrs", "Ms", "Dr"], "example": "Mr" },
                        "firstName": { "type": "string", "example": "Kartik" },
                        "lastName":  { "type": "string", "example": "Shah" },
                        "gender":    { "type": "string", "enum": ["MALE", "FEMALE", "OTHER"], "example": "MALE" },
                        "phone":     { "type": "string", "description": "Mobile number. If omitted, auto-generated per school settings.", "example": "9999988888" }
                    }
                }

            }
        }
    };

    window.onload = () => {
        SwaggerUIBundle({
            spec,
            dom_id: '#swagger-ui',
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],
            layout: "StandaloneLayout",
            docExpansion: "list",
            defaultModelsExpandDepth: 1,
            defaultModelExpandDepth: 2,
            displayRequestDuration: true,
            tryItOutEnabled: false,
            filter: true,
            deepLinking: true
        });
    };
</script>
</body>
</html>

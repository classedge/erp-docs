<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Login API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #fff; }
  </style>
  <script>
    const spec = {
      "swagger": "2.0",
      "info": {
        "title": "School Login API",
        "description": "API for authenticating a school/organization and obtaining a bearer token using Basic authorization.",
        "version": "2.0",
        "contact": {
          "email": "niteshg@tataclassedge.com"
        }
      },
      // "host": "{{base_url}}",
      // "basePath": "/guide/rule-api/31",
      "schemes": ["https"],
      "tags": [
        {
          "name": "Authentication",
          "description": "Operations related to ERP token generation"
        }
      ],
      "paths": {
        "/guide/rule-api/31/api/v2/erp/token": {
          "post": {
            "tags": ["Authentication"],
            "summary": "School Login",
            "description": "Authenticates an organization using a static Basic authorization token and returns a bearer token (Basic_Token) for subsequent API calls.",
            "operationId": "schoolLogin",
            "consumes": ["application/json"],
            "produces": ["text/plain", "application/json"],
            "parameters": [
              {
                "in": "header",
                "name": "Authorization",
                "description": "Static Basic authorization token. Format: `Basic <Static_Basic_Token>`",
                "required": true,
                "type": "string",
                "default": "Basic {{Static_Basic_Token}}"
              },
              {
                "in": "body",
                "name": "body",
                "description": "Login credentials for the organization.",
                "required": true,
                "schema": {
                  "$ref": "#/definitions/LoginRequest"
                }
              }
            ],
            "responses": {
              "200": {
                "description": "Authentication successful. Returns the bearer token as plain text.",
                "schema": {
                  "type": "string",
                  "example": "{{Basic_Token}}"
                }
              },
              "400": {
                "description": "Bad Request — Organization ID is incorrect or not found.",
                "schema": {
                  "$ref": "#/definitions/BadRequestResponse"
                }
              },
              "500": {
                "description": "Internal Server Error — Invalid Static Basic Token or a server-side issue. Please contact the TCE team for assistance.",
                "schema": {
                  "$ref": "#/definitions/InternalServerErrorResponse"
                }
              }
            }
          }
        }
      },
      "definitions": {
        "BadRequestResponse": {
          "type": "object",
          "properties": {
            "errorCode": {
              "type": "integer",
              "example": 1
            },
            "errorMessage": {
              "type": "string",
              "example": "Institution not found"
            }
          }
        },
        "InternalServerErrorResponse": {
          "type": "object",
          "properties": {
            "errorCode": {
              "type": "integer",
              "example": 500
            },
            "errorMessage": {
              "type": "string",
              "example": "WEB-MjAyNi0wNi0wOSAxMjo1MDo1OTo0MjQ="
            }
          }
        },
        "LoginRequest": {
          "type": "object",
          "required": ["username", "grant_type"],
          "properties": {
            "username": {
              "type": "string",
              "description": "The organization ID used as the login username.",
              "example": "{{orgId}}"
            },
            "grant_type": {
              "type": "string",
              "description": "The grant type for the authentication flow.",
              "example": "org_auto"
            }
          }
        }
      }
    };

    window.onload = function () {
      SwaggerUIBundle({
        spec: spec,
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        deepLinking: true,
        defaultModelsExpandDepth: 2,
        defaultModelExpandDepth: 2,
        displayRequestDuration: true,
        tryItOutEnabled: true
      });
    };
  </script>
</body>
</html>
